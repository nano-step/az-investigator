name: Bug report
description: Something in the skill doesn't work as documented
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Before you submit, please confirm:
        - You've run `bash scripts/audit-persistence.sh` and `bash scripts/install.sh` (or `scripts/repair.sh`) and the issue persists.
        - You've checked [`references/known-quirks.md`](https://github.com/nano-step/az-investigator/blob/master/references/known-quirks.md) — many footguns are documented there.
        - You've searched existing issues for duplicates.

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. "`run-kql stg '<query>'` should return rows…"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Paste the exact command + output. Sanitize any real subscription IDs / instrumentation keys / user IDs first.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest sequence of steps that reproduces the bug.
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS + container + az CLI version + opencode version
      placeholder: "macOS 14.5 / Docker ai-sandbox Debian 12 / az 2.86.0 / opencode 0.x"
    validations:
      required: true

  - type: textarea
    id: lesson
    attributes:
      label: Lesson worth capturing?
      description: If this surprised you in a way the docs didn't predict, please also run `bash harness/scripts/capture-lesson.sh` and link the resulting lesson file here.
    validations:
      required: false
